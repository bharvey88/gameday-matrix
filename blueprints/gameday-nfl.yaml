blueprint:
  name: "NFL Game Day: TeamTracker on HUB75 Matrix"
  description: >-
    Shows your NFL team's game on a HUB75 matrix running
    [hub75-studio](https://github.com/pavlov-net/hub75-studio) (Apollo M-1 or
    any supported controller). Switches the matrix to your Team Tracker page
    before kickoff, celebrates touchdowns and field goals with your team's
    colors, and switches back after the game. College football works too.


    **Prerequisites**

    1. Matrix flashed once with a hub75-studio config that includes the
    zero-config "Team Tracker Live" page (see the
    [example config](https://github.com/bharvey88/gameday-matrix/tree/main/firmware)).
    No team names or sensors in the YAML; this blueprint pushes the game data.
    The older per-team compiled page works too.

    2. The [Team Tracker](https://github.com/vasqued2/ha-teamtracker)
    integration installed via HACS, with a sensor for your team.

    3. Optional: hub75-studio's media proxy running if you want team logos on
    the page.


    **Setup**

    Pick your team's sensor and your matrix; the rest is automatic. Full
    walkthrough in the [README](https://github.com/bharvey88/gameday-matrix).


    Blueprint version: 13 (scoreboard reappears within seconds, not minutes)
  domain: automation
  source_url: https://github.com/bharvey88/gameday-matrix/blob/main/blueprints/gameday-nfl.yaml
  input:
    matrix:
      name: Matrix
      icon: mdi:television
      input:
        teamtracker_sensor:
          name: Team Tracker sensor
          description: The Team Tracker sensor for your team.
          selector:
            entity:
              filter:
                integration: teamtracker
                domain: sensor
        matrix_device:
          name: Matrix
          description: >-
            Your HUB75 matrix running hub75-studio. If the dropdown is empty,
            your matrix is running firmware from before hub75-studio identified
            itself to Home Assistant; update the device's firmware first.
          selector:
            device:
              filter:
                - integration: esphome
                  manufacturer: pavlov-net
                  model: hub75-studio
        game_page:
          name: Team Tracker page name (optional)
          description: >-
            Leave empty to auto-detect: the blueprint picks the page whose
            name contains "Team Tracker", preferring one that mentions your
            team. Only fill this in if auto-detect picks the wrong page, using
            the exact name from the Select Page entity's dropdown.
          default: ""
          selector:
            text:
        ticker_parts:
          name: Ticker content
          description: >-
            What scrolls along the bottom of the scoreboard during a game.
            Long plays are trimmed so the ticker stays readable.
          default:
            - "Game clock"
            - "Down & distance"
            - "Last play"
          selector:
            select:
              multiple: true
              options:
                - "Game clock"
                - "Down & distance"
                - "Last play"
                - "TV network (pre-game)"
        push_action:
          name: Data push action override (optional)
          description: >-
            Only for the zero-config "Team Tracker Live" page. Normally the
            blueprint works out the device's esphome.*_teamtracker_update
            action from the page select entity; set this only if that guess
            fails (check Developer Tools > Actions for the exact name).
          default: ""
          selector:
            text:
    timing:
      name: Timing
      icon: mdi:clock-outline
      input:
        pregame_lead:
          name: Pre-game lead-in
          description: >-
            Switch to the game page this many minutes before kickoff. 0 waits
            for the game to actually start.
          default: 15
          selector:
            number:
              min: 0
              max: 180
              step: 5
              unit_of_measurement: minutes
        postgame_linger:
          name: Post-game linger
          description: >-
            Keep the final score on screen this long after the game ends, then
            switch back to whatever page was showing before.
          default: 10
          selector:
            number:
              min: 0
              max: 60
              step: 1
              unit_of_measurement: minutes
    celebrations:
      name: Celebrations
      icon: mdi:party-popper
      collapsed: true
      input:
        ambient_pause_entities:
          name: Ambient lighting to pause (optional)
          description: >-
            Running HyperHDR, Hyperion, or another ambient-capture system that
            streams to your celebration lights? Pick its entities here (the
            Hyperion integration's light entities work) AND add them to the
            celebration lights above so the color hits instantly through the
            stream. The stream only pauses while an optional WLED effect runs,
            and resumes exactly as it was.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: light
                - domain: switch
        celebration_lights:
          name: Celebration lights
          description: >-
            Lights to flash in your team's colors when your team scores. They
            return to their previous state afterward. Color-capable lights
            work best (WLED strips, RGB bulbs).
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: light
        hold_seconds:
          name: Celebration hold
          description: >-
            How long the lights hold your team's color on a field goal.
            Touchdowns hold a bit longer, extra points shorter. All lights
            change together in one go, so mixed hardware stays in sync.
          default: 3
          selector:
            number:
              min: 1
              max: 15
              step: 1
              unit_of_measurement: seconds
        touchdown_effect:
          name: Extra light effect on touchdown (optional)
          description: >-
            The team-color strobe is the main celebration and needs nothing
            set here. Add a WLED effect on top if you want motion; "Lightning"
            reads great on strips behind a TV. Runs on every celebration light
            that supports it, then the light goes back to what it was doing.
          default: "None"
          selector:
            select:
              options:
                - "None"
                - "Lightning"
                - "Strobe"
                - "Strobe Mega"
                - "Chase Flash"
                - "Theater"
                - "Wipe"
        field_goal_effect:
          name: Extra light effect on field goal (optional)
          default: "None"
          selector:
            select:
              options:
                - "None"
                - "Lightning"
                - "Strobe"
                - "Strobe Mega"
                - "Chase Flash"
                - "Theater"
                - "Wipe"
        score_effect:
          name: Extra light effect on any other score (optional)
          default: "None"
          selector:
            select:
              options:
                - "None"
                - "Lightning"
                - "Strobe"
                - "Strobe Mega"
                - "Chase Flash"
                - "Theater"
                - "Wipe"
        wled_restore_seconds:
          name: Effect celebration length
          description: How long the optional effect runs before the lights go back to what they were doing.
          default: 8
          selector:
            number:
              min: 3
              max: 120
              step: 1
              unit_of_measurement: seconds
        touchdown_action:
          name: Touchdown action
          description: >-
            Runs when your team's score jumps by 6, 7, or 8 points. Good spot
            for a WLED preset or effect.
          default: []
          selector:
            action:
        field_goal_action:
          name: Field goal action
          description: >-
            Runs when your team's score jumps by exactly 3 points.
          default: []
          selector:
            action:
        score_action:
          name: Other score action
          description: >-
            Runs on any other scoring play, like a lone extra point, a
            two-point conversion, or a safety.
          default: []
          selector:
            action:

mode: queued
max: 25

triggers:
  - alias: "Pre-game window check"
    trigger: time_pattern
    minutes: "/5"
    id: pregame_check
  - alias: "Game started"
    trigger: state
    entity_id: !input teamtracker_sensor
    to: "IN"
    id: game_start
  - alias: "Team score changed"
    trigger: state
    entity_id: !input teamtracker_sensor
    attribute: team_score
    id: score
  - alias: "Game ended"
    trigger: state
    entity_id: !input teamtracker_sensor
    to: "POST"
    id: game_end
  - alias: "Any game data changed"
    trigger: state
    entity_id: !input teamtracker_sensor
    id: push

variables:
  teamtracker_sensor: !input teamtracker_sensor
  matrix_device: !input matrix_device
  game_page: !input game_page
  push_action: !input push_action
  ticker_parts: !input ticker_parts
  page_select: >-
    {%- set ns = namespace(found='', fallback='') -%}
    {%- for e in device_entities(matrix_device) -%}
    {%- if e.startswith('select.') -%}
    {%- set opts = state_attr(e, 'options') or [] -%}
    {%- if ns.found == '' and opts | select('search', '(?i)team\\s*tracker') | list | length > 0 -%}
    {%- set ns.found = e -%}
    {%- endif -%}
    {%- if ns.fallback == '' and 'select_page' in e -%}
    {%- set ns.fallback = e -%}
    {%- endif -%}
    {%- endif -%}
    {%- endfor -%}
    {{ ns.found if ns.found != '' else ns.fallback }}
  resolved_push_action: >-
    {%- if push_action | trim != '' -%}
    {{ push_action | trim }}
    {%- else -%}
    esphome.{{ device_attr(matrix_device, 'name') | lower | regex_replace('[^a-z0-9]+', '_') }}_teamtracker_update
    {%- endif -%}
  pregame_lead: !input pregame_lead
  celebration_lights: !input celebration_lights
  hold_seconds: !input hold_seconds
  touchdown_effect: !input touchdown_effect
  field_goal_effect: !input field_goal_effect
  score_effect: !input score_effect
  resolved_game_page: >-
    {%- if game_page | trim != '' -%}
    {{ game_page | trim }}
    {%- else -%}
    {%- set opts = state_attr(page_select, 'options') or [] -%}
    {%- set tt = opts | select('search', '(?i)team\\s*tracker') | list -%}
    {%- set team = state_attr(teamtracker_sensor, 'team_name') -%}
    {%- set named = (tt | select('search', '(?i)' ~ team) | list) if team else [] -%}
    {{ ((named + tt) | first) | default('', true) }}
    {%- endif -%}
  snapshot_scene_id: "gameday_page_{{ this.entity_id.split('.')[1] }}"
  ambient_pause_entities: !input ambient_pause_entities
  lights_scene_id: "gameday_lights_{{ this.entity_id.split('.')[1] }}"
  ambient_scene_id: "gameday_ambient_{{ this.entity_id.split('.')[1] }}"

actions:
  - alias: "Push game data to the matrix (Team Tracker Live page)"
    if:
      - alias: "Data changed or periodic refresh, sensor has data"
        condition: template
        value_template: >-
          {{ trigger.id in ['push', 'pregame_check'] and
             states(teamtracker_sensor) not in ['unavailable', 'unknown'] }}
    then:
      - alias: "Send current game state to the device"
        continue_on_error: true
        action: "{{ resolved_push_action }}"
        data:
          game_state: "{{ states(teamtracker_sensor) }}"
          team_abbr: "{{ state_attr(teamtracker_sensor, 'team_abbr') | default('', true) }}"
          team_score: "{{ state_attr(teamtracker_sensor, 'team_score') | int(0) }}"
          opponent_abbr: "{{ state_attr(teamtracker_sensor, 'opponent_abbr') | default('', true) }}"
          opponent_score: "{{ state_attr(teamtracker_sensor, 'opponent_score') | int(0) }}"
          team_logo: "{{ state_attr(teamtracker_sensor, 'team_logo') | default('', true) }}"
          opponent_logo: "{{ state_attr(teamtracker_sensor, 'opponent_logo') | default('', true) }}"
          possession: >-
            {%- set poss = state_attr(teamtracker_sensor, 'possession') | string -%}
            {%- if poss == state_attr(teamtracker_sensor, 'team_id') | string and poss != 'None' -%}1
            {%- elif poss == state_attr(teamtracker_sensor, 'opponent_id') | string and poss != 'None' -%}2
            {%- else -%}0{%- endif -%}
          team_timeouts: "{{ state_attr(teamtracker_sensor, 'team_timeouts') | int(0) }}"
          opponent_timeouts: "{{ state_attr(teamtracker_sensor, 'opponent_timeouts') | int(0) }}"
          team_record: "{{ state_attr(teamtracker_sensor, 'team_record') | default('', true) }}"
          opponent_record: "{{ state_attr(teamtracker_sensor, 'opponent_record') | default('', true) }}"
          splash_text: ""
          splash_color: 0
          status_text: >-
            {%- set s = states(teamtracker_sensor) -%}
            {%- if s == 'IN' -%}
            {%- set parts = [] -%}
            {%- if 'Down & distance' in ticker_parts -%}
            {%- set parts = parts + [state_attr(teamtracker_sensor, 'down_distance_text') | default('', true)] -%}
            {%- endif -%}
            {%- if 'Game clock' in ticker_parts -%}
            {%- set parts = parts + [state_attr(teamtracker_sensor, 'clock') | default('', true)] -%}
            {%- endif -%}
            {%- if 'Last play' in ticker_parts -%}
            {%- set parts = parts + [state_attr(teamtracker_sensor, 'last_play') | default('', true) | truncate(160, true, '...')] -%}
            {%- endif -%}
            {%- set line = parts | select('ne', '') | join('  |  ') -%}
            {{ line if line != '' else 'In Progress' }}
            {%- elif s == 'PRE' -%}
            {%- set kick = state_attr(teamtracker_sensor, 'kickoff_in') | default('Upcoming', true) -%}
            {%- set tv = state_attr(teamtracker_sensor, 'tv_network') | default('', true) -%}
            {%- if 'TV network (pre-game)' in ticker_parts and tv != '' -%}
            {{ kick }}  |  {{ tv }}
            {%- else -%}
            {{ kick }}
            {%- endif -%}
            {%- elif s == 'POST' -%}
            {{ state_attr(teamtracker_sensor, 'clock') | default('Final', true) }}
            {%- else -%}
            {{ state_attr(teamtracker_sensor, 'kickoff_in') | default(s, true) }}
            {%- endif -%}
  - choose:
      - alias: "Switch to the game page"
        conditions:
          - alias: "Pre-game window or game start"
            condition: or
            conditions:
              - condition: trigger
                id: game_start
              - alias: "Inside the pre-game window"
                condition: and
                conditions:
                  - condition: trigger
                    id: pregame_check
                  - condition: state
                    entity_id: !input teamtracker_sensor
                    state: "PRE"
                  - alias: "Kickoff is within the lead-in"
                    condition: template
                    value_template: >-
                      {% set kickoff = as_datetime(state_attr(teamtracker_sensor, 'date')) %}
                      {{ kickoff is not none and
                         0 <= (kickoff - now()).total_seconds() <= pregame_lead * 60 }}
              - alias: "Game already live (catches mid-game setup, reboots, HA restarts)"
                condition: and
                conditions:
                  - condition: trigger
                    id:
                      - pregame_check
                      - push
                  - condition: state
                    entity_id: !input teamtracker_sensor
                    state: "IN"
          - alias: "Game page found and not already showing"
            condition: template
            value_template: >-
              {{ resolved_game_page != '' and
                 states(page_select) != resolved_game_page }}
        sequence:
          - alias: "Remember the current page"
            action: scene.create
            data:
              scene_id: "{{ snapshot_scene_id }}"
              snapshot_entities:
                - "{{ page_select }}"
          - alias: "Show the game page"
            action: select.select_option
            target:
              entity_id: "{{ page_select }}"
            data:
              option: "{{ resolved_game_page }}"

      - alias: "Celebrate a score"
        conditions:
          - condition: trigger
            id: score
          - alias: "Game is live"
            condition: state
            entity_id: !input teamtracker_sensor
            state: "IN"
          - alias: "Score went up (ignore resets and corrections)"
            condition: template
            value_template: >-
              {{ trigger.from_state is not none and trigger.to_state is not none and
                 (trigger.from_state.attributes.team_score | int(-1)) >= 0 and
                 (trigger.to_state.attributes.team_score | int(-1)) >
                 (trigger.from_state.attributes.team_score | int(-1)) }}
        sequence:
          - variables:
              score_delta: >-
                {{ (trigger.to_state.attributes.team_score | int(0)) -
                   (trigger.from_state.attributes.team_score | int(0)) }}
              sport: "{{ state_attr(teamtracker_sensor, 'sport') | lower }}"
              score_type: >-
                {%- if sport == 'football' and score_delta in [6, 7, 8] -%}td
                {%- elif sport == 'football' and score_delta == 3 -%}fg
                {%- else -%}other{%- endif -%}
              celebration_hold: >-
                {{ hold_seconds * 2 if score_type == 'td'
                   else hold_seconds if score_type == 'fg'
                   else [hold_seconds // 2, 1] | max }}
              fx_effect: >-
                {%- if score_type == 'td' -%}{{ touchdown_effect }}
                {%- elif score_type == 'fg' -%}{{ field_goal_effect }}
                {%- else -%}{{ score_effect }}
                {%- endif -%}
              fx_targets: >-
                {%- set ns = namespace(t=[]) -%}
                {%- for l in celebration_lights -%}
                {%- if fx_effect != 'None' and fx_effect in (state_attr(l, 'effect_list') or []) -%}
                {%- set ns.t = ns.t + [l] -%}
                {%- endif -%}
                {%- endfor -%}
                {{ ns.t }}
              solid_targets: >-
                {%- set ns = namespace(t=[]) -%}
                {%- for l in celebration_lights -%}
                {%- if 'Solid' in (state_attr(l, 'effect_list') or []) -%}
                {%- set ns.t = ns.t + [l] -%}
                {%- endif -%}
                {%- endfor -%}
                {{ ns.t }}
              team_colors: >-
                {% set tc = state_attr(teamtracker_sensor, 'team_colors') %}
                {% if tc is string %}{{ [tc, tc] }}
                {% elif tc is sequence and tc | length > 0 %}{{ tc | list }}
                {% else %}{{ ['#FFFFFF', '#FF0000'] }}{% endif %}
              color_a: >-
                {% set c = (team_colors[0] | replace('#', '')) %}
                {% if c | length >= 6 %}
                {{ [c[0:2] | int(base=16), c[2:4] | int(base=16), c[4:6] | int(base=16)] }}
                {% else %}{{ [255, 255, 255] }}{% endif %}
          - alias: "Splash the score on the matrix"
            continue_on_error: true
            action: "{{ resolved_push_action }}"
            data:
              game_state: "{{ states(teamtracker_sensor) }}"
              team_abbr: "{{ state_attr(teamtracker_sensor, 'team_abbr') | default('', true) }}"
              team_score: "{{ state_attr(teamtracker_sensor, 'team_score') | int(0) }}"
              opponent_abbr: "{{ state_attr(teamtracker_sensor, 'opponent_abbr') | default('', true) }}"
              opponent_score: "{{ state_attr(teamtracker_sensor, 'opponent_score') | int(0) }}"
              team_logo: "{{ state_attr(teamtracker_sensor, 'team_logo') | default('', true) }}"
              opponent_logo: "{{ state_attr(teamtracker_sensor, 'opponent_logo') | default('', true) }}"
              possession: 0
              team_timeouts: "{{ state_attr(teamtracker_sensor, 'team_timeouts') | int(0) }}"
              opponent_timeouts: "{{ state_attr(teamtracker_sensor, 'opponent_timeouts') | int(0) }}"
              team_record: "{{ state_attr(teamtracker_sensor, 'team_record') | default('', true) }}"
              opponent_record: "{{ state_attr(teamtracker_sensor, 'opponent_record') | default('', true) }}"
              status_text: "{{ state_attr(teamtracker_sensor, 'clock') | default('In Progress', true) }}"
              splash_text: >-
                {%- if score_type == 'td' -%}TOUCHDOWN!
                {%- elif score_type == 'fg' -%}FIELD GOAL!
                {%- else -%}SCORE!{%- endif -%}
              splash_color: "{{ (team_colors[0] | replace('#', '')) | int(base=16) }}"
          - alias: "Flash the celebration lights in team colors"
            if:
              - alias: "Any celebration lights configured"
                condition: template
                value_template: "{{ celebration_lights | count > 0 }}"
            then:
              - alias: "Remember the lights' current state"
                action: scene.create
                data:
                  scene_id: "{{ lights_scene_id }}"
                  snapshot_entities: "{{ celebration_lights }}"
              - alias: "All lights to team color in one hit"
                action: light.turn_on
                target:
                  entity_id: !input celebration_lights
                data:
                  rgb_color: "{{ color_a }}"
                  brightness: 255
              - alias: "Clear any leftover effect on strips that keep one"
                if:
                  - condition: template
                    value_template: "{{ solid_targets | count > 0 }}"
                then:
                  - continue_on_error: true
                    action: light.turn_on
                    target:
                      entity_id: "{{ solid_targets }}"
                    data:
                      effect: "Solid"
                      rgb_color: "{{ color_a }}"
                      brightness: 255
              - alias: "Hold, scaled to the score"
                delay:
                  seconds: "{{ celebration_hold }}"
          - alias: "Run a light effect for this score type"
            if:
              - alias: "A celebration light supports this effect"
                condition: template
                value_template: "{{ fx_targets | length > 0 }}"
            then:
              - alias: "Pause ambient capture so the effect can show"
                if:
                  - alias: "Ambient entities configured"
                    condition: template
                    value_template: "{{ ambient_pause_entities | count > 0 }}"
                then:
                  - alias: "Remember the ambient state"
                    action: scene.create
                    data:
                      scene_id: "{{ ambient_scene_id }}"
                      snapshot_entities: "{{ ambient_pause_entities }}"
                  - alias: "Stop the ambient stream (strips hold the team color meanwhile)"
                    continue_on_error: true
                    action: homeassistant.turn_off
                    target:
                      entity_id: "{{ ambient_pause_entities }}"
                  - alias: "Let the strips leave live mode"
                    delay:
                      milliseconds: 1800
              - alias: "Run the effect in the team color"
                continue_on_error: true
                action: light.turn_on
                target:
                  entity_id: "{{ fx_targets }}"
                data:
                  effect: "{{ fx_effect }}"
                  rgb_color: "{{ color_a }}"
                  brightness: 255
              - alias: "Let it run"
                delay:
                  seconds: !input wled_restore_seconds
          - alias: "Put every celebration light back how it was"
            if:
              - condition: template
                value_template: "{{ states('scene.' ~ lights_scene_id) not in ['unknown', 'unavailable', none] }}"
            then:
              - continue_on_error: true
                action: scene.turn_on
                target:
                  entity_id: "scene.{{ lights_scene_id }}"
          - alias: "Run the matching score action"
            choose:
              - alias: "Touchdown (+6 to +8)"
                conditions:
                  - condition: template
                    value_template: "{{ sport == 'football' and score_delta in [6, 7, 8] }}"
                sequence: !input touchdown_action
              - alias: "Field goal (+3)"
                conditions:
                  - condition: template
                    value_template: "{{ sport == 'football' and score_delta == 3 }}"
                sequence: !input field_goal_action
            default: !input score_action
          - alias: "Resume ambient capture as it was"
            if:
              - alias: "Ambient entities were paused"
                condition: template
                value_template: >-
                  {{ ambient_pause_entities | count > 0 and
                     states('scene.' ~ ambient_scene_id) not in ['unknown', 'unavailable', none] }}
            then:
              - continue_on_error: true
                action: scene.turn_on
                target:
                  entity_id: "scene.{{ ambient_scene_id }}"

      - alias: "Restore the previous page after the game"
        conditions:
          - condition: trigger
            id: game_end
        sequence:
          - alias: "Let the final score linger"
            delay:
              minutes: !input postgame_linger
          - alias: "Restore the page that was showing before (if the snapshot survived)"
            if:
              - condition: template
                value_template: "{{ states('scene.' ~ snapshot_scene_id) not in ['unknown', 'unavailable', none] }}"
            then:
              - action: scene.turn_on
                target:
                  entity_id: "scene.{{ snapshot_scene_id }}"
