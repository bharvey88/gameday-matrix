blueprint:
  name: "NFL Game Day: TeamTracker on HUB75 Matrix"
  description: >-
    Shows your NFL team's game on a HUB75 matrix running
    [hub75-studio](https://github.com/pavlov-net/hub75-studio) (Apollo M-1 or
    any supported controller). Switches the matrix to your Team Tracker page
    before kickoff, celebrates touchdowns and field goals with your team's
    colors, and switches back after the game. College football works too.


    **Prerequisites**

    1. Matrix flashed once with a hub75-studio config that includes the
    zero-config "Team Tracker Live" page (see the
    [example config](https://github.com/bharvey88/gameday-matrix/tree/main/firmware)).
    No team names or sensors in the YAML; this blueprint pushes the game data.
    The older per-team compiled page works too.

    2. The [Team Tracker](https://github.com/vasqued2/ha-teamtracker)
    integration installed via HACS, with a sensor for your team.

    3. Optional: hub75-studio's media proxy running if you want team logos on
    the page.


    **Setup**

    Pick your team's sensor and the matrix's "Select Page" entity; the rest is
    automatic. Full walkthrough in the
    [README](https://github.com/bharvey88/gameday-matrix).
  domain: automation
  source_url: https://github.com/bharvey88/gameday-matrix/blob/main/blueprints/gameday-nfl.yaml
  input:
    matrix:
      name: Matrix
      icon: mdi:television
      input:
        teamtracker_sensor:
          name: Team Tracker sensor
          description: The Team Tracker sensor for your team.
          selector:
            entity:
              filter:
                integration: teamtracker
                domain: sensor
        matrix_device:
          name: Matrix
          description: >-
            Your HUB75 matrix running hub75-studio. If the dropdown is empty,
            your matrix is running firmware from before hub75-studio identified
            itself to Home Assistant; update the device's firmware first.
          selector:
            device:
              filter:
                - integration: esphome
                  manufacturer: pavlov-net
                  model: hub75-studio
        game_page:
          name: Team Tracker page name (optional)
          description: >-
            Leave empty to auto-detect: the blueprint picks the page whose
            name contains "Team Tracker", preferring one that mentions your
            team. Only fill this in if auto-detect picks the wrong page, using
            the exact name from the Select Page entity's dropdown.
          default: ""
          selector:
            text:
        push_action:
          name: Data push action override (optional)
          description: >-
            Only for the zero-config "Team Tracker Live" page. Normally the
            blueprint works out the device's esphome.*_teamtracker_update
            action from the page select entity; set this only if that guess
            fails (check Developer Tools > Actions for the exact name).
          default: ""
          selector:
            text:
    timing:
      name: Timing
      icon: mdi:clock-outline
      input:
        pregame_lead:
          name: Pre-game lead-in
          description: >-
            Switch to the game page this many minutes before kickoff. 0 waits
            for the game to actually start.
          default: 15
          selector:
            number:
              min: 0
              max: 180
              step: 5
              unit_of_measurement: minutes
        postgame_linger:
          name: Post-game linger
          description: >-
            Keep the final score on screen this long after the game ends, then
            switch back to whatever page was showing before.
          default: 10
          selector:
            number:
              min: 0
              max: 60
              step: 1
              unit_of_measurement: minutes
    celebrations:
      name: Celebrations
      icon: mdi:party-popper
      collapsed: true
      input:
        celebration_lights:
          name: Celebration lights
          description: >-
            Lights to flash in your team's colors when your team scores. They
            return to their previous state afterward. Color-capable lights
            work best (WLED strips, RGB bulbs).
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: light
        flash_cycles:
          name: Flash cycles
          description: >-
            Baseline for the light flash: how many times the lights alternate
            between team colors on a field goal. Touchdowns automatically flash
            twice as long and faster; extra points shorter.
          default: 4
          selector:
            number:
              min: 1
              max: 10
              step: 1
        wled_preset_select:
          name: WLED preset entity (optional)
          description: >-
            Have a WLED strip? Pick its Preset entity and name presets below to
            fire on scores. The strip returns to its previous preset afterward.
          default: []
          selector:
            entity:
              filter:
                - integration: wled
                  domain: select
        touchdown_preset:
          name: WLED preset on touchdown
          description: Exact preset name to run on a touchdown, for example "Fireworks".
          default: ""
          selector:
            text:
        field_goal_preset:
          name: WLED preset on field goal
          default: ""
          selector:
            text:
        score_preset:
          name: WLED preset on any other score
          default: ""
          selector:
            text:
        wled_restore_seconds:
          name: WLED celebration length
          description: How long the preset runs before the strip goes back to what it was doing.
          default: 15
          selector:
            number:
              min: 3
              max: 120
              step: 1
              unit_of_measurement: seconds
        touchdown_action:
          name: Touchdown action
          description: >-
            Runs when your team's score jumps by 6, 7, or 8 points. Good spot
            for a WLED preset or effect.
          default: []
          selector:
            action:
        field_goal_action:
          name: Field goal action
          description: >-
            Runs when your team's score jumps by exactly 3 points.
          default: []
          selector:
            action:
        score_action:
          name: Other score action
          description: >-
            Runs on any other scoring play, like a lone extra point, a
            two-point conversion, or a safety.
          default: []
          selector:
            action:

mode: queued
max: 25

triggers:
  - alias: "Pre-game window check"
    trigger: time_pattern
    minutes: "/5"
    id: pregame_check
  - alias: "Game started"
    trigger: state
    entity_id: !input teamtracker_sensor
    to: "IN"
    id: game_start
  - alias: "Team score changed"
    trigger: state
    entity_id: !input teamtracker_sensor
    attribute: team_score
    id: score
  - alias: "Game ended"
    trigger: state
    entity_id: !input teamtracker_sensor
    to: "POST"
    id: game_end
  - alias: "Any game data changed"
    trigger: state
    entity_id: !input teamtracker_sensor
    id: push

variables:
  teamtracker_sensor: !input teamtracker_sensor
  matrix_device: !input matrix_device
  game_page: !input game_page
  push_action: !input push_action
  page_select: >-
    {%- set ns = namespace(found='', fallback='') -%}
    {%- for e in device_entities(matrix_device) -%}
    {%- if e.startswith('select.') -%}
    {%- set opts = state_attr(e, 'options') or [] -%}
    {%- if ns.found == '' and opts | select('search', '(?i)team\\s*tracker') | list | length > 0 -%}
    {%- set ns.found = e -%}
    {%- endif -%}
    {%- if ns.fallback == '' and 'select_page' in e -%}
    {%- set ns.fallback = e -%}
    {%- endif -%}
    {%- endif -%}
    {%- endfor -%}
    {{ ns.found if ns.found != '' else ns.fallback }}
  resolved_push_action: >-
    {%- if push_action | trim != '' -%}
    {{ push_action | trim }}
    {%- else -%}
    esphome.{{ device_attr(matrix_device, 'name') | lower | regex_replace('[^a-z0-9]+', '_') }}_teamtracker_update
    {%- endif -%}
  pregame_lead: !input pregame_lead
  celebration_lights: !input celebration_lights
  flash_cycles: !input flash_cycles
  touchdown_preset: !input touchdown_preset
  field_goal_preset: !input field_goal_preset
  score_preset: !input score_preset
  resolved_game_page: >-
    {%- if game_page | trim != '' -%}
    {{ game_page | trim }}
    {%- else -%}
    {%- set opts = state_attr(page_select, 'options') or [] -%}
    {%- set tt = opts | select('search', '(?i)team\\s*tracker') | list -%}
    {%- set team = state_attr(teamtracker_sensor, 'team_name') -%}
    {%- set named = (tt | select('search', '(?i)' ~ team) | list) if team else [] -%}
    {{ ((named + tt) | first) | default('', true) }}
    {%- endif -%}
  snapshot_scene_id: "gameday_page_{{ this.entity_id.split('.')[1] }}"
  lights_scene_id: "gameday_lights_{{ this.entity_id.split('.')[1] }}"
  wled_scene_id: "gameday_wled_{{ this.entity_id.split('.')[1] }}"

actions:
  - alias: "Push game data to the matrix (Team Tracker Live page)"
    if:
      - alias: "Data changed or periodic refresh, sensor has data"
        condition: template
        value_template: >-
          {{ trigger.id in ['push', 'pregame_check'] and
             states(teamtracker_sensor) not in ['unavailable', 'unknown'] }}
    then:
      - alias: "Send current game state to the device"
        continue_on_error: true
        action: "{{ resolved_push_action }}"
        data:
          game_state: "{{ states(teamtracker_sensor) }}"
          team_abbr: "{{ state_attr(teamtracker_sensor, 'team_abbr') | default('', true) }}"
          team_score: "{{ state_attr(teamtracker_sensor, 'team_score') | int(0) }}"
          opponent_abbr: "{{ state_attr(teamtracker_sensor, 'opponent_abbr') | default('', true) }}"
          opponent_score: "{{ state_attr(teamtracker_sensor, 'opponent_score') | int(0) }}"
          team_logo: "{{ state_attr(teamtracker_sensor, 'team_logo') | default('', true) }}"
          opponent_logo: "{{ state_attr(teamtracker_sensor, 'opponent_logo') | default('', true) }}"
          status_text: >-
            {%- set s = states(teamtracker_sensor) -%}
            {%- if s == 'PRE' -%}
            {{ state_attr(teamtracker_sensor, 'kickoff_in') | default('Upcoming', true) }}
            {%- elif s == 'IN' -%}
            {{ state_attr(teamtracker_sensor, 'clock') | default('In Progress', true) }}
            {%- elif s == 'POST' -%}
            {{ state_attr(teamtracker_sensor, 'clock') | default('Final', true) }}
            {%- else -%}
            {{ state_attr(teamtracker_sensor, 'kickoff_in') | default(s, true) }}
            {%- endif -%}
  - choose:
      - alias: "Switch to the game page"
        conditions:
          - alias: "Pre-game window or game start"
            condition: or
            conditions:
              - condition: trigger
                id: game_start
              - alias: "Inside the pre-game window"
                condition: and
                conditions:
                  - condition: trigger
                    id: pregame_check
                  - condition: state
                    entity_id: !input teamtracker_sensor
                    state: "PRE"
                  - alias: "Kickoff is within the lead-in"
                    condition: template
                    value_template: >-
                      {% set kickoff = as_datetime(state_attr(teamtracker_sensor, 'date')) %}
                      {{ kickoff is not none and
                         0 <= (kickoff - now()).total_seconds() <= pregame_lead * 60 }}
              - alias: "Game already live (catches mid-game setup and HA restarts)"
                condition: and
                conditions:
                  - condition: trigger
                    id: pregame_check
                  - condition: state
                    entity_id: !input teamtracker_sensor
                    state: "IN"
          - alias: "Game page found and not already showing"
            condition: template
            value_template: >-
              {{ resolved_game_page != '' and
                 states(page_select) != resolved_game_page }}
        sequence:
          - alias: "Remember the current page"
            action: scene.create
            data:
              scene_id: "{{ snapshot_scene_id }}"
              snapshot_entities:
                - "{{ page_select }}"
          - alias: "Show the game page"
            action: select.select_option
            target:
              entity_id: "{{ page_select }}"
            data:
              option: "{{ resolved_game_page }}"

      - alias: "Celebrate a score"
        conditions:
          - condition: trigger
            id: score
          - alias: "Game is live"
            condition: state
            entity_id: !input teamtracker_sensor
            state: "IN"
          - alias: "Score went up (ignore resets and corrections)"
            condition: template
            value_template: >-
              {{ trigger.from_state is not none and trigger.to_state is not none and
                 (trigger.from_state.attributes.team_score | int(-1)) >= 0 and
                 (trigger.to_state.attributes.team_score | int(-1)) >
                 (trigger.from_state.attributes.team_score | int(-1)) }}
        sequence:
          - variables:
              score_delta: >-
                {{ (trigger.to_state.attributes.team_score | int(0)) -
                   (trigger.from_state.attributes.team_score | int(0)) }}
              sport: "{{ state_attr(teamtracker_sensor, 'sport') | lower }}"
              score_type: >-
                {%- if sport == 'football' and score_delta in [6, 7, 8] -%}td
                {%- elif sport == 'football' and score_delta == 3 -%}fg
                {%- else -%}other{%- endif -%}
              celebration_cycles: >-
                {{ flash_cycles * 2 if score_type == 'td'
                   else flash_cycles if score_type == 'fg'
                   else [flash_cycles // 2, 2] | max }}
              flash_ms: "{{ 250 if score_type == 'td' else 450 }}"
              wled_select: !input wled_preset_select
              wled_preset: >-
                {%- if score_type == 'td' -%}{{ touchdown_preset | trim }}
                {%- elif score_type == 'fg' -%}{{ field_goal_preset | trim }}
                {%- else -%}{{ score_preset | trim }}
                {%- endif -%}
              team_colors: >-
                {% set tc = state_attr(teamtracker_sensor, 'team_colors') %}
                {% if tc is string %}{{ [tc, tc] }}
                {% elif tc is sequence and tc | length > 0 %}{{ tc | list }}
                {% else %}{{ ['#FFFFFF', '#FF0000'] }}{% endif %}
              color_a: >-
                {% set c = (team_colors[0] | replace('#', '')) %}
                {% if c | length >= 6 %}
                {{ [c[0:2] | int(base=16), c[2:4] | int(base=16), c[4:6] | int(base=16)] }}
                {% else %}{{ [255, 255, 255] }}{% endif %}
              color_b: >-
                {% set c = ((team_colors[1] if team_colors | length > 1 else team_colors[0]) | replace('#', '')) %}
                {% if c | length >= 6 %}
                {{ [c[0:2] | int(base=16), c[2:4] | int(base=16), c[4:6] | int(base=16)] }}
                {% else %}{{ [255, 0, 0] }}{% endif %}
          - alias: "Flash the celebration lights in team colors"
            if:
              - alias: "Any celebration lights configured"
                condition: template
                value_template: "{{ celebration_lights | count > 0 }}"
            then:
              - alias: "Remember the lights' current state"
                action: scene.create
                data:
                  scene_id: "{{ lights_scene_id }}"
                  snapshot_entities: "{{ celebration_lights }}"
              - alias: "Alternate between the two team colors, scaled to the score"
                repeat:
                  count: "{{ celebration_cycles }}"
                  sequence:
                    - alias: "Team color one"
                      action: light.turn_on
                      target:
                        entity_id: !input celebration_lights
                      data:
                        rgb_color: "{{ color_a }}"
                        brightness: 255
                    - delay:
                        milliseconds: "{{ flash_ms }}"
                    - alias: "Team color two"
                      action: light.turn_on
                      target:
                        entity_id: !input celebration_lights
                      data:
                        rgb_color: "{{ color_b }}"
                        brightness: 255
                    - delay:
                        milliseconds: "{{ flash_ms }}"
              - alias: "Restore the lights"
                action: scene.turn_on
                target:
                  entity_id: "scene.{{ lights_scene_id }}"
          - alias: "Run a WLED preset for this score type"
            if:
              - alias: "WLED entity picked and a preset named for this score"
                condition: template
                value_template: "{{ wled_select | length > 0 and wled_preset != '' }}"
            then:
              - alias: "Remember the strip's current preset"
                action: scene.create
                data:
                  scene_id: "{{ wled_scene_id }}"
                  snapshot_entities:
                    - "{{ wled_select }}"
              - alias: "Fire the celebration preset"
                continue_on_error: true
                action: select.select_option
                target:
                  entity_id: "{{ wled_select }}"
                data:
                  option: "{{ wled_preset }}"
              - alias: "Let it run"
                delay:
                  seconds: !input wled_restore_seconds
              - alias: "Back to the previous preset (if one was active)"
                if:
                  - condition: template
                    value_template: "{{ states('scene.' ~ wled_scene_id) not in ['unknown', 'unavailable', none] }}"
                then:
                  - continue_on_error: true
                    action: scene.turn_on
                    target:
                      entity_id: "scene.{{ wled_scene_id }}"
          - alias: "Run the matching score action"
            choose:
              - alias: "Touchdown (+6 to +8)"
                conditions:
                  - condition: template
                    value_template: "{{ sport == 'football' and score_delta in [6, 7, 8] }}"
                sequence: !input touchdown_action
              - alias: "Field goal (+3)"
                conditions:
                  - condition: template
                    value_template: "{{ sport == 'football' and score_delta == 3 }}"
                sequence: !input field_goal_action
            default: !input score_action

      - alias: "Restore the previous page after the game"
        conditions:
          - condition: trigger
            id: game_end
        sequence:
          - alias: "Let the final score linger"
            delay:
              minutes: !input postgame_linger
          - alias: "Restore the page that was showing before (if the snapshot survived)"
            if:
              - condition: template
                value_template: "{{ states('scene.' ~ snapshot_scene_id) not in ['unknown', 'unavailable', none] }}"
            then:
              - action: scene.turn_on
                target:
                  entity_id: "scene.{{ snapshot_scene_id }}"
