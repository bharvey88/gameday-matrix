# Example config for a MoonHub75 pinout with the zero-config "Team Tracker Live"
# page from the bharvey88/hub75-studio fork (gameday branch; moves to the
# official repo when merged upstream). No team configuration in here: flash
# once, then pick your team in the Game Day blueprint in Home Assistant.
#
# Works with any HUB75 panel. Set the panel substitutions below to match your
# hardware; the scoreboard measures the display at boot and lays itself out to
# fit (single 64x64 panel and two-wide 128x64 both supported). If your
# controller uses a different pinout, change the pins in the display block.

substitutions:
  name: "hub75-matrix"
  friendly_name: "HUB75 Matrix"

  # ===== Display / Panel =====
  # A single panel is rows 1 / cols 1; two panels side by side is cols 2.
  display_panel_width: 64
  display_panel_height: 64
  display_layout: HORIZONTAL
  display_layout_rows: 1
  display_layout_cols: 1
  display_scan_wiring: STANDARD_TWO_SCAN

  DISPLAY_W: ${display_panel_width * display_layout_cols}
  DISPLAY_H: ${display_panel_height * display_layout_rows}

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      compiler_optimization: PERF
      execute_from_psram: true
      enable_idf_experimental_features: true
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y

psram:
  mode: octal
  speed: 80MHz

logger:

api:

ota:
  platform: esphome

wifi:
  power_save_mode: none
  ap:

captive_portal:

web_server:
  version: 3

# ===== MoonHub75 pinout =====
display:
  - platform: hub75
    id: matrix

    r1_pin: GPIO1
    g1_pin: GPIO5
    b1_pin: GPIO6
    r2_pin: GPIO7
    g2_pin: GPIO13
    b2_pin: GPIO9
    a_pin: GPIO16
    b_pin: GPIO48
    c_pin: GPIO47
    d_pin: GPIO21
    e_pin: GPIO38
    lat_pin: GPIO8
    oe_pin: GPIO4
    clk_pin: GPIO18

    panel_width: ${display_panel_width}
    panel_height: ${display_panel_height}
    layout: ${display_layout}
    layout_rows: ${display_layout_rows}
    layout_cols: ${display_layout_cols}
    scan_wiring: ${display_scan_wiring}

    clock_phase: false
    latch_blanking: 1
    clock_speed: 20MHz
    bit_depth: 8

    # For LVGL
    double_buffer: false
    auto_clear_enabled: false
    update_interval: never

lvgl:
  byte_order: little_endian
  buffer_size: 100%
  displays:
    - matrix

# Boot button (GPIO0) toggles the display power switch from utils.yaml.
# GPIO0 is a strapping pin but is safe as an input once booted.
binary_sensor:
  - platform: gpio
    id: power_button
    internal: true
    pin:
      number: GPIO0
      ignore_strapping_warning: true
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_click:
      then:
        - switch.toggle: power

packages:
  remote_package_files:
    url: https://github.com/bharvey88/hub75-studio
    ref: gameday
    refresh: 0s
    files:
      # Sets minimum supported ESPHome version
      - path: packages/common/esphome-version.yaml

      # Shared helpers, sensors, buttons
      - path: packages/common/utils.yaml

      # Shared fonts and LVGL styles
      - path: packages/common/theme.yaml

      # Shared DDP and DDP websocket control config (needed for team logos)
      - path: packages/common/ddp.yaml
        vars:
          ddp_port: "4048"
          ws_ddp_host: "homeassistant.local"
          ws_ddp_port: "8788"
          device_id: "${name}"

      # Basic boot screen
      - path: packages/pages/bios.yaml

      # Simple clock page (something to restore to after the game)
      - path: packages/pages/clock.yaml
        vars:
          page_friendly_name: "Clock"

      # Zero-config scoreboard, fed by the Game Day blueprint
      - path: packages/pages/teamtracker-live.yaml
